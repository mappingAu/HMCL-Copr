upstream_project_url: https://github.com/HMCL-dev/HMCL
upstream_tag_template: "v{version}"

specfile_path: SPECS/hmcl.spec
upstream_package_name: hmcl
downstream_package_name: hmcl

actions:
  post-upstream-clone:
    - bash -c 'TAG=$(git describe --tags --abbrev=0 | sed "s/^v//"); sed -i "s/%global jar_version .*/%global jar_version $TAG/" SPECS/hmcl.spec'

jobs:
  - job: copr_build
    trigger: pull_request
    owner: mapping1
    project: HMCL

  - job: copr_build
    trigger: release
    owner: mapping1
    project: HMCL
