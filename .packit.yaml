# Packit configuration for the HMCL Copr package.
#
# HMCL only publishes prebuilt binaries, never source tarballs, so there is
# nothing to build from an upstream git checkout.  The package therefore
# repackages the jar attached to the upstream GitHub release, which is fetched
# by the `create-archive` action below; packit then rewrites Source0 in
# hmcl.spec to point at the local copy of that jar.
#
# Note: every action entry is executed as a single command (shlex-split, no
# shell), hence the explicit `bash -ec '...'` wrapper.

specfile_path: hmcl.spec
downstream_package_name: hmcl
upstream_package_name: hmcl

actions:
  create-archive:
    - >-
      bash -ec 'version=$(sed -n "s/^Version:[[:space:]]*//p" hmcl.spec | head -n 1);
      jar="HMCL-${version}.jar";
      curl -fsSL --retry 3 --retry-delay 2 -o "${jar}"
      "https://github.com/HMCL-dev/HMCL/releases/download/v${version}/${jar}";
      echo "${jar}"'

jobs:
  # Build pull requests so packaging changes can be tested before they land.
  - job: copr_build
    trigger: pull_request
    owner: mapping1
    project: HMCL

  # Build every push to the default branch, including the version bumps
  # committed by .github/workflows/update-hmcl-version.yml.
  - job: copr_build
    trigger: commit
    branch: main
    owner: mapping1
    project: HMCL
